server.port=8082
spring.application.name=ORDER-SERVICE

# Section 11 - "Don't hard-code service URLs". Override at startup without
# touching Java, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--user.service.base-url=http://localhost:9091
#
# Day 6 note: this is still a fixed address, deliberately — see README.md's
# "Day 6" section for why Order Service's own call to User Service wasn't
# switched to discovery-based lookup, even though this service now
# registers itself with Eureka below.
user.service.base-url=http://localhost:8081

# Day 6: register with the Eureka discovery server as ORDER-SERVICE, so the
# API Gateway can route /orders/** to this instance by name.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
