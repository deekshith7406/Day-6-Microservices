server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      # The key idea from Section 12: lb://USER-SERVICE targets the
      # registered service NAME, not a hard-coded IP/port. The gateway asks
      # Eureka "where is USER-SERVICE right now?" on every request.
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
